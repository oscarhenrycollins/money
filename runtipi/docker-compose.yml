services:
  money:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    pids_limit: 64
    user: 1000:1000
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 128m
    tmpfs:
    - /tmp
    environment:
      PORT: '8809'
      BIND: 0.0.0.0
      PYTHONDONTWRITEBYTECODE: '1'
      DATA_DIR: /data/private
      WIZARD_TRUSTED_HOSTS: ${WIZARD_TRUSTED_HOSTS:-}
      WIZARD_TRUSTED_ORIGINS: ${WIZARD_TRUSTED_ORIGINS:-}
    volumes:
    - ${APP_DATA_DIR}/data:/data
    read_only: true
    command:
    - python
    - -c
    - "import base64,json,pathlib,runpy\nroot=pathlib.Path('/tmp/wizard-app');root.mkdir(exist_ok=True)\nfiles=json.loads(base64.b64decode(''))\n\
      for name,text in files.items():\n p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)\nrunpy.run_path(str(root/'app/server.py'),run_name='__main__')\n"
    x-runtipi:
      is_main: true
      internal_port: 8809
x-runtipi:
  schema_version: 2
  overrides: []
